services:
  attendance-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: attendance-server
    ports:
      - "5000:5000"
    volumes:
      # データベースを永続化（親ディレクトリのdataをマウント）
      - ../data:/data
      # テンプレートファイルを最新に保つ
      - ./server/templates:/app/templates
      # サーバーコード（リファクタリング版）を最新に保つ
      - ./server/server.py:/app/server.py
      - ./server/database.py:/app/database.py
      - ./server/utils.py:/app/utils.py
      - ./server/config.py:/app/config.py
      - ./server/overtime.py:/app/overtime.py
      - ./server/leave_request.py:/app/leave_request.py
      - ./server/api_attendance.py:/app/api_attendance.py
      - ./server/api_overtime.py:/app/api_overtime.py
      - ./server/api_leave.py:/app/api_leave.py
    environment:
      - TZ=Asia/Tokyo
      # サーバー設定
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5000
      - FLASK_DEBUG=False
      - FLASK_ENV=docker
      # データベース設定
      - DATABASE_PATH=/data/attendance.db
      # チャタリング防止設定
      - CHATTERING_THRESHOLD=10
      # API設定
      - API_VERSION=1.0.0
      - DEFAULT_SEARCH_LIMIT=100
      - STATS_LATEST_RECORDS=10
      # 給与計算期間設定
      - PAYROLL_START_DAY=16
      - PAYROLL_END_DAY=15
      # バリデーション設定
      - EMPLOYEE_ID_MIN_LENGTH=3
      - EMPLOYEE_ID_MAX_LENGTH=20
      - YEAR_MIN=2000
      - YEAR_MAX=2100
    restart: unless-stopped
    networks:
      - attendance-network

networks:
  attendance-network:
    driver: bridge

