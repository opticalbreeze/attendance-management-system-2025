services:
  attendance-server:
    build: .
    container_name: attendance-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # データベースをDockerの外（attendance/dataフォルダ）に永続化
      - type: bind
        source: ../../data
        target: /app/data
      # テンプレートファイルを最新に保つ
      - type: bind
        source: ./templates
        target: /app/templates
      # staticファイル（CSS/JS）を最新に保つ
      - type: bind
        source: ./static
        target: /app/static
      # サーバーコードを最新に保つ
      - type: bind
        source: ./server.py
        target: /app/server.py
      - type: bind
        source: ./pdf_generator.py
        target: /app/pdf_generator.py
      - type: bind
        source: ./database.py
        target: /app/database.py
      - type: bind
        source: ./api_attendance.py
        target: /app/api_attendance.py
      - type: bind
        source: ./api_overtime.py
        target: /app/api_overtime.py
      - type: bind
        source: ./api_leave.py
        target: /app/api_leave.py
      - type: bind
        source: ./api_monthly_report.py
        target: /app/api_monthly_report.py
      - type: bind
        source: ./monthly_report.py
        target: /app/monthly_report.py
      - type: bind
        source: ./utils.py
        target: /app/utils.py
      - type: bind
        source: ./work_type_constants.py
        target: /app/work_type_constants.py
      - type: bind
        source: ./attendance_check_service.py
        target: /app/attendance_check_service.py
      - type: bind
        source: ./constants.py
        target: /app/constants.py
      - type: bind
        source: ./alert_utils.py
        target: /app/alert_utils.py
      - type: bind
        source: ./api_check_status.py
        target: /app/api_check_status.py
      - type: bind
        source: ./api_notifications.py
        target: /app/api_notifications.py
      - type: bind
        source: ./admin.py
        target: /app/admin.py
      - type: bind
        source: ./auth.py
        target: /app/auth.py
      - type: bind
        source: ./config.py
        target: /app/config.py
      - type: bind
        source: ./logger_config.py
        target: /app/logger_config.py
      - type: bind
        source: ./pdf_utils.py
        target: /app/pdf_utils.py
      # notification_data.jsonのマウント
      - type: bind
        source: ../notification_data.json
        target: /app/notification_data.json
      # acknowledged_notifications.jsonのマウント
      - type: bind
        source: ../acknowledged_notifications.json
        target: /app/acknowledged_notifications.json
      # notification_exclusions.jsonのマウント
      - type: bind
        source: ../notification_exclusions.json
        target: /app/notification_exclusions.json
      # バックアップディレクトリをホストにマウント
      - type: bind
        source: ../../backup
        target: /backup
      # Dドライブバックアップディレクトリをマウント（Dドライブが存在する場合）
      # 一時的にコメントアウト - マウントパスの問題を解決
      # - type: bind
      #   source: D:/AttendanceBackup_Mirror
      #   target: /app/D_drive_backup
      # auto_save.pyのマウント
      - type: bind
        source: ./auto_save.py
        target: /app/auto_save.py
    environment:
      - TZ=Asia/Tokyo
      # サーバー設定
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5000
      - FLASK_DEBUG=False
      - FLASK_ENV=docker
      # データベース設定（ホストのdataディレクトリにマウント）
      - DATABASE_PATH=/app/data/attendance.db
      # PDF保存先設定（ホストのdata/PDFディレクトリにマウント）
      - PDF_SAVE_DIR=/app/data/PDF
      # チャタリング防止設定
      - CHATTERING_THRESHOLD=10
      # API設定
      - API_VERSION=1.0.0
      - DEFAULT_SEARCH_LIMIT=100
      - STATS_LATEST_RECORDS=10
      # 給与計算期間設定
      - PAYROLL_START_DAY=16
      - PAYROLL_END_DAY=15
      # バリデーション設定
      - EMPLOYEE_ID_MIN_LENGTH=3
      - EMPLOYEE_ID_MAX_LENGTH=20
      - YEAR_MIN=2000
      - YEAR_MAX=2100
      # セキュリティ設定（本番環境では必ず変更）
      - SECRET_KEY=change-me-in-production-please-set-secure-key
      - ADMIN_PASSWORD=admin
      - DB_PASSWORD=dbadmin
    networks:
      - attendance-network

networks:
  attendance-network:
    driver: bridge

