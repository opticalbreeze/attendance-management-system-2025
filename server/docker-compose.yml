services:
  attendance-server:
    build: .
    container_name: attendance-server
    ports:
      - "5000:5000"
    volumes:
      # データベースをDockerの外（attendance/dataフォルダ）に永続化
      - type: bind
        source: ../../data
        target: /app/data
      # テンプレートファイルを最新に保つ
      - type: bind
        source: ./templates
        target: /app/templates
    environment:
      - TZ=Asia/Tokyo
      # サーバー設定
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5000
      - FLASK_DEBUG=False
      - FLASK_ENV=docker
      # データベース設定（ホストのdataディレクトリにマウント）
      - DATABASE_PATH=/app/data/attendance.db
      # PDF保存先設定（ホストのdata/PDFディレクトリにマウント）
      - PDF_SAVE_DIR=/app/data/PDF
      # チャタリング防止設定
      - CHATTERING_THRESHOLD=10
      # API設定
      - API_VERSION=1.0.0
      - DEFAULT_SEARCH_LIMIT=100
      - STATS_LATEST_RECORDS=10
      # 給与計算期間設定
      - PAYROLL_START_DAY=16
      - PAYROLL_END_DAY=15
      # バリデーション設定
      - EMPLOYEE_ID_MIN_LENGTH=3
      - EMPLOYEE_ID_MAX_LENGTH=20
      - YEAR_MIN=2000
      - YEAR_MAX=2100
      # セキュリティ設定（本番環境では必ず変更）
      - SECRET_KEY=change-me-in-production-please-set-secure-key
      - ADMIN_PASSWORD=admin
      - DB_PASSWORD=dbadmin
    restart: unless-stopped
    networks:
      - attendance-network

networks:
  attendance-network:
    driver: bridge

