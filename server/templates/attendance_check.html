<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打刻チェック確認（管理者専用）</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/minimal-ui.css') }}">
    <style>
        .container {
            max-width: 1400px;
        }
        
        .search-form {
            background: var(--bg-secondary);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            border: var(--border-width) solid var(--border-color);
        }
        
        /* トースト通知アニメーション */
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
        
        .btn-search {
            background: var(--accent-color);
            color: var(--bg-primary);
            border-color: var(--accent-color);
            margin-right: var(--spacing-sm);
        }
        
        .btn-search:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        
        .btn-clear {
            background: var(--bg-primary);
            color: var(--text-primary);
            border-color: var(--border-color);
        }
        
        .btn-clear:hover {
            background: var(--bg-hover);
        }
        
        .results-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-primary);
            table-layout: fixed;
        }
        
        .results-table thead {
            background: var(--bg-secondary);
        }
        
        .results-table th {
            padding: var(--spacing-sm) var(--spacing-sm);
            text-align: left;
            font-weight: 400;
            font-size: var(--font-size-sm);
        }
        
        /* 列幅の最適化 */
        .results-table th:nth-child(1) { width: 80px; }  /* 従業員ID */
        .results-table th:nth-child(2) { width: 100px; } /* 従業員名 */
        .results-table th:nth-child(3) { width: 90px; }  /* 勤務日 */
        .results-table th:nth-child(4) { width: 90px; }  /* 勤務タイプ */
        .results-table th:nth-child(5) { width: 70px; }  /* 開始時刻 */
        .results-table th:nth-child(6) { width: 70px; }  /* 終了時刻 */
        .results-table th:nth-child(7) { width: 120px; } /* 打刻時間 */
        .results-table th:nth-child(8) { width: 150px; } /* エラー */
        .results-table th:nth-child(9) { width: 120px; } /* 確認状況 */
        .results-table th:nth-child(10) { width: 80px; } /* 時間外 */
        .results-table th:nth-child(11) { width: 80px; } /* 休暇 */
        
        .results-table td {
            padding: var(--spacing-xs) var(--spacing-sm);
            border-bottom: var(--border-width) solid var(--border-color);
            font-size: var(--font-size-sm);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .results-table tbody tr:hover {
            background: var(--bg-hover);
        }
        
        .idm-cell {
            font-family: 'Courier New', monospace;
            font-weight: 400;
            color: var(--accent-color);
        }
        
        .work-type {
            display: inline-block;
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--border-radius);
            font-size: var(--font-size-sm);
            font-weight: 400;
            color: var(--text-primary);
            white-space: nowrap;
            min-width: 60px;
            text-align: center;
            border: var(--border-width) solid var(--border-color);
            background: var(--bg-secondary);
        }
        
        .work-type.shift-24 {
            background: var(--bg-secondary);
            border-color: var(--border-color);
        }
        
        .work-type.day-shift {
            background: var(--bg-secondary);
        }
        
        .work-type.night-shift {
            background: var(--bg-secondary);
        }
        
        .work-type.office {
            background: var(--bg-secondary);
        }
        
        .work-type.off-day {
            background: var(--bg-secondary);
        }
        
        .work-type.holiday {
            background: var(--bg-secondary);
        }
        
        .work-type.paid-leave {
            background: var(--bg-secondary);
        }
        
        /* チェック機構のスタイル */
        .check-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .check-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }
        
        .check-item input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }
        
        .check-item label {
            font-size: var(--font-size-sm);
            cursor: pointer;
            user-select: none;
        }
        
        .check-status {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-top: var(--spacing-xs);
        }
        
        .check-status.completed {
            color: var(--text-primary);
            font-weight: 400;
        }
        
        .alert-item {
            display: block;
            padding: var(--spacing-xs) var(--spacing-sm);
            margin: var(--spacing-xs) 0;
            border-radius: var(--border-radius);
            font-size: var(--font-size-sm);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
            border-left: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        .alert-item.error {
            border-left-color: var(--border-color);
        }
        
        .alert-item.warning {
            border-left-color: var(--border-color);
        }
        
        .alert-item.info {
            border-left-color: var(--border-color);
        }
        
        /* 打刻時間表示のスタイル */
        .attendance-times {
            font-family: 'Courier New', monospace;
            font-size: var(--font-size-sm);
        }
        
        .attendance-time {
            display: inline-block;
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: var(--spacing-xs) var(--spacing-xs);
            border-radius: var(--border-radius);
            margin: 1px;
            font-weight: 400;
            cursor: help;
            border: var(--border-width) solid var(--border-color);
        }
        
        .attendance-time.valid-clock-in {
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-weight: 400;
            border-color: var(--accent-color);
        }
        
        .attendance-time.valid-clock-out {
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-weight: 400;
            border-color: var(--accent-color);
        }
        
        .no-attendance {
            color: var(--text-secondary);
            font-style: normal;
        }
        
        .alert-icon {
            margin-right: var(--spacing-xs);
            font-weight: 400;
        }
        
        .loading, .no-results {
            text-align: center;
            color: var(--text-secondary);
            padding: var(--spacing-xl);
            font-size: var(--font-size-lg);
        }
        
        .error {
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: var(--spacing-md);
            border: var(--border-width) solid var(--border-color);
            margin-bottom: var(--spacing-md);
        }
        
        .results-section {
            margin-top: var(--spacing-lg);
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }
        
        .results-count {
            font-size: var(--font-size-lg);
            font-weight: 400;
            color: var(--text-primary);
        }
        
        .btn-export {
            background: var(--accent-color);
            color: var(--bg-primary);
            padding: var(--spacing-sm) var(--spacing-md);
            border: var(--border-width) solid var(--accent-color);
            cursor: pointer;
            font-weight: 400;
        }
        
        .btn-export:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 打刻チェック確認（管理者専用）</h1>
        <a href="/admin" class="back-link" style="color: #dc3545; border-color: #dc3545; font-weight: bold;">← 管理者メニューに戻る</a>
        
        <div class="search-form">
            <form id="search-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="section-select">セクション（任意）</label>
                        <select id="section-select" name="section">
                            <option value="">すべてのセクション</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="employee-id">従業員（必須）</label>
                        <select id="employee-id" name="employee_id" required>
                            <option value="">▼ 従業員を選択してください</option>
                        </select>
                        <small id="employee-hint" style="color: #666; font-size: 0.8em; display: none;">
                            従業員データを読み込み中...
                        </small>
                    </div>
                    
                    <div class="form-group">
                        <label for="search-month">検索月（必須）</label>
                        <input type="text" id="search-month" name="search_month" placeholder="例: 2025/12" value="" pattern="[0-9]{4}/[0-9]{1,2}" required>
                        <small style="color: #666; font-size: 0.8em; margin-top: 3px;">
                            yyyy/mm形式で入力（前月16日〜当月15日を検索）
                        </small>
                    </div>
                </div>
                <div>
                    <button type="submit" class="btn btn-search">🔍 検索</button>
                    <button type="button" class="btn btn-clear" onclick="clearForm()">🔄 クリア</button>
                </div>
            </form>
        </div>
        
        <div id="error-message" style="display: none;" class="error"></div>
        
        <div class="results-section" id="results-section" style="display: none;">
            <div class="results-header">
                <div class="results-count" id="results-count">検索結果: 0 件</div>
                <button class="btn-export" onclick="exportCSV()">📥 CSV出力</button>
            </div>
            
            <div style="overflow-x: auto;">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>従業員ID</th>
                            <th>従業員名</th>
                            <th>勤務日 📅↑</th>
                            <th>勤務タイプ</th>
                            <th>開始時刻</th>
                            <th>終了時刻</th>
                            <th>実際の打刻時間 🕐</th>
                            <th>エラー・警告</th>
                            <th>確認状況</th>
                            <th>時間外申告</th>
                            <th>休暇願</th>
                        </tr>
                    </thead>
                    <tbody id="results-body">
                    </tbody>
                </table>
            </div>
        </div>
        
        <div id="loading" class="loading" style="display: none;">
            検索中...
        </div>
        
        <div id="no-results" class="no-results" style="display: none;">
            検索条件に一致するデータが見つかりませんでした。
        </div>
    </div>
    
    <!-- 共通ライブラリを読み込み -->
    <script src="{{ url_for('static', filename='js/attendance-common.js') }}"></script>
    
    <script>
        let searchResults = [];
        
        // ページ読み込み時の初期化処理
        // 全従業員データを保持
        let allEmployees = [];
        
        document.addEventListener('DOMContentLoaded', async function() {
            // 従業員情報を動的に読み込み
            await loadEmployees();
            
        // 現在の日付から適切な月度を計算して設定
        function calculateCurrentPayrollMonth() {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1; // 0ベースなので+1
            const day = today.getDate();
            
            // 16日以降なら翌月度、15日以前なら当月度
            if (day >= 16) {
                // 翌月度
                if (month === 12) {
                    return `${year + 1}/1`;
                } else {
                    return `${year}/${month + 1}`;
                }
            } else {
                // 当月度
                return `${year}/${month}`;
            }
        }
        
        document.getElementById('search-month').value = calculateCurrentPayrollMonth();            // セクション変更時に従業員リストを更新
            const sectionSelect = document.getElementById('section-select');
            if (sectionSelect) {
                sectionSelect.addEventListener('change', updateEmployeeList);
            }
        });
        
        // 従業員情報を動的に読み込む
        async function loadEmployees() {
            const employeeSelect = document.getElementById('employee-id');
            const sectionSelect = document.getElementById('section-select');
            const employeeHint = document.getElementById('employee-hint');
            
            try {
                const response = await fetch('/api/employees');
                
                // HTTPステータスコードをチェック
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('[loadEmployees] HTTPエラー:', response.status, errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText.substring(0, 100)}`);
                }
                
                // Content-Typeをチェック
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const errorText = await response.text();
                    console.error('[loadEmployees] JSONでないレスポンス:', contentType, errorText.substring(0, 200));
                    throw new Error('サーバーからJSON以外のレスポンスが返されました（認証エラーの可能性があります）');
                }
                
                const result = await response.json();
                console.log('[loadEmployees] APIレスポンス:', result);
                
                if (result.status === 'success' && result.data) {
                    // 全従業員データを保存
                    allEmployees = result.data;
                    console.log(`[loadEmployees] ${result.data.length}名の従業員を読み込みました`);
                    
                    // セクション一覧を取得・設定
                    const sections = [...new Set(result.data.map(emp => emp.section || '設備'))].sort();
                    sectionSelect.innerHTML = '<option value="">すべてのセクション</option>';
                    sections.forEach(section => {
                        const option = document.createElement('option');
                        option.value = section;
                        option.textContent = section;
                        sectionSelect.appendChild(option);
                    });
                    
                    // 従業員リストを更新
                    updateEmployeeList();
                    
                    // ヒント表示を有効化
                    employeeHint.style.display = 'block';
                    employeeHint.textContent = `${result.data.length}名の従業員が読み込まれました`;
                    employeeHint.style.color = '#28a745';
                } else {
                    const errorMsg = result.message || '従業員データの読み込みに失敗';
                    console.error('[loadEmployees] APIエラー:', errorMsg, result);
                    throw new Error(errorMsg);
                }
            } catch (error) {
                console.error('[loadEmployees] エラー詳細:', error);
                employeeSelect.innerHTML = '<option value="">❌ 従業員データ読み込み失敗</option>';
                employeeHint.style.display = 'block';
                employeeHint.textContent = `従業員データの読み込みに失敗しました: ${error.message}`;
                employeeHint.style.color = '#e74c3c';
            }
        }
        
        // セクションで絞り込んだ従業員リストを更新
        function updateEmployeeList() {
            const employeeSelect = document.getElementById('employee-id');
            const sectionSelect = document.getElementById('section-select');
            const selectedSection = sectionSelect.value;
            
            // 既存のオプションをクリア
            employeeSelect.innerHTML = '<option value="">▼ 従業員を選択してください</option>';
            
            // セクションでフィルタリング
            const filteredEmployees = selectedSection 
                ? allEmployees.filter(emp => (emp.section || '設備') === selectedSection)
                : allEmployees;
            
            // 従業員データでオプションを構築
            filteredEmployees.forEach(employee => {
                const option = document.createElement('option');
                option.value = employee.employee_num;
                
                // 表示名を構築（24勤シフトがある場合は明示）
                let displayName = `${employee.employee_num} - ${employee.name}`;
                if (employee.has_24hour_shifts) {
                    displayName += ' (24勤あり)';
                }
                if (employee.total_schedules > 0) {
                    displayName += ` [${employee.total_schedules}件]`;
                }
                
                option.textContent = displayName;
                
                employeeSelect.appendChild(option);
            });
        }
        
        // フォーム送信
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await performSearch();
        });
        
        // 検索実行
        async function performSearch() {
            const employeeId = document.getElementById('employee-id').value.trim();
            const searchMonth = document.getElementById('search-month').value.trim();
            
            // バリデーション
            if (!employeeId) {
                showError('従業員IDを入力してください');
                return;
            }
            
            if (!searchMonth) {
                showError('検索月を入力してください（yyyy/mm形式）');
                return;
            }
            
            // 検索月の形式チェック
            const monthPattern = /^[0-9]{4}\/[0-9]{1,2}$/;
            if (!monthPattern.test(searchMonth)) {
                showError('検索月はyyyy/mm形式で入力してください（例: 2025/10）');
                return;
            }
            
            // UIリセット
            document.getElementById('results-section').style.display = 'none';
            document.getElementById('no-results').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            // クエリパラメータ構築
            const params = new URLSearchParams();
            params.append('employee_id', employeeId);
            params.append('search_month', searchMonth);
            
            const searchUrl = `/api/search?${params}`;

            try {
                const response = await fetch(searchUrl);
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (data.status === 'success') {
                    searchResults = data.results;
                    await displayResults(data.results, data.search_params);
                } else {
                    showError(data.message || '検索エラーが発生しました');
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showError('サーバーとの通信エラーが発生しました');
            }
        }
        
        // 検索結果を表示
        async function displayResults(results, searchParams) {


            if (results.length === 0) {
                document.getElementById('no-results').style.display = 'block';
                return;
            }

            // 日付順でソート（古い順）
            results.sort((a, b) => {
                const dateA = new Date(a.work_date);
                const dateB = new Date(b.work_date);
                return dateA - dateB;
            });

            // 24勤の退勤時刻を翌日の明に移動するための前処理
            results = processNightShiftEndTimes(results);
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = '';
            
            results.forEach(item => {
                const tr = document.createElement('tr');
                // 打刻時間を整形（有効な打刻に色を付けるため、全結果とitemを渡す）
                const attendanceTimesHtml = formatAttendanceTimes(item.attendance_records || [], item.work_type, item.work_date, results, item);
                
                // IDとシート番号は非表示だが、データは保持される（item.id, item.sheet_number）
                // アラート情報を表示
                const alerts = item.alerts || [];
                const alertsHtml = formatAlerts(alerts);
                
                // 確認状況を生成
                const checkStatusHtml = generateCheckStatusHTML(item, alerts);
                
                tr.innerHTML = `
                    <td class="idm-cell">${item.employee_id}</td>
                    <td><strong>${item.employee_name || ''}</strong></td>
                    <td>${formatDate(item.work_date)}</td>
                    <td><span class="work-type ${getWorkTypeClass(item.work_type)}">${item.work_type || ''}</span></td>
                    <td>${formatTime(item.start_time)}</td>
                    <td>${formatEndTime(item)}</td>
                    <td class="attendance-times">${attendanceTimesHtml}</td>
                    <td id="alerts-${item.work_date}" style="font-size: 0.85em;">${alertsHtml}</td>
                    <td id="check-status-${item.employee_id}-${item.work_date}" style="font-size: 0.85em;">${checkStatusHtml}</td>
                    <td id="overtime-${item.work_date}" style="font-size: 0.85em; color: #667eea;">-</td>
                    <td id="leave-${item.work_date}" style="font-size: 0.85em; color: #28a745;">-</td>
                `;
                // 全データを行要素に保存（後で使用可能）
                tr.dataset.fullData = JSON.stringify(item);
                tbody.appendChild(tr);
            });
            
            // 時間外・休暇願データを非同期で取得
            const employeeId = searchParams.employee_id;
            fetchOvertimeDataForMonth(employeeId, results);
            fetchLeaveDataForMonth(employeeId, results);
            
            // チェック状況を読み込む
            await loadCheckStatuses(results);
            
            // 検索範囲の情報を表示
            let rangeInfo = '';
            if (searchParams && searchParams.date_range) {
                rangeInfo = ` (${searchParams.date_range.start_date} 〜 ${searchParams.date_range.end_date})`;
            }
            
            document.getElementById('results-count').textContent = `検索結果: ${results.length} 件${rangeInfo}`;
            document.getElementById('results-section').style.display = 'block';
        }
        
        // 日付フォーマット
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const dt = new Date(dateStr);
            return dt.toLocaleDateString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }
        
        // 時刻フォーマット
        function formatTime(timeStr) {
            if (!timeStr) return '';
            // ISO時刻文字列の場合
            if (timeStr.includes('T') || timeStr.includes(' ')) {
                const dt = new Date(timeStr);
                return dt.toLocaleTimeString('ja-JP', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
            // HH:MM形式の場合はそのまま返す
            return timeStr;
        }

        // 24勤の退勤時刻を翌日の明に移動する処理
        function processNightShiftEndTimes(results) {
            const processedResults = [...results];
            
            for (let i = 0; i < processedResults.length; i++) {
                const currentItem = processedResults[i];
                
                // 24勤の場合
                if (currentItem.work_type && currentItem.work_type.includes('24勤')) {
                    // 翌日の明を探す
                    const currentDate = new Date(currentItem.work_date);
                    const nextDay = new Date(currentDate);
                    nextDay.setDate(currentDate.getDate() + 1);
                    const nextDateStr = nextDay.toISOString().split('T')[0];
                    
                    const nextDayOffItem = processedResults.find(item => 
                        item.work_date === nextDateStr && item.work_type === '明'
                    );
                    
                    if (nextDayOffItem && currentItem.end_time) {
                        // 24勤の退勤時刻を翌日の明に移動
                        nextDayOffItem.night_shift_end_time = currentItem.end_time;
                        nextDayOffItem.night_shift_work_type = currentItem.work_type;
                        
                        // 24勤の退勤時刻をクリア
                        currentItem.end_time = null;
                    }
                }
            }
            
            return processedResults;
        }

        // 退勤時刻表示（24勤の場合は翌日明に表示）
        function formatEndTime(item) {
            // 明の行で、前日24勤の退勤時刻がある場合
            if (item.work_type === '明' && item.night_shift_end_time) {
                const timeStr = formatTime(item.night_shift_end_time);
                return `${timeStr} <span style="color: #3498db; font-size: 0.8em;">(${item.night_shift_work_type}退勤)</span>`;
            }
            
            // 24勤の場合は退勤時刻を表示しない（翌日明に移動済み）
            if (item.work_type && item.work_type.includes('24勤')) {
                return '<span style="color: #999; font-style: italic;">翌日明に表示</span>';
            }
            
            // 通常勤務の場合はそのまま
            return formatTime(item.end_time);
        }
        
        // 勤務タイプに応じたCSSクラスを返す
        function getWorkTypeClass(workType) {
            if (!workType) return '';
            if (workType.includes('24勤')) return 'shift-24';
            if (workType.includes('日勤')) return 'day-shift';
            if (workType.includes('夜勤')) return 'night-shift';
            if (workType.includes('所')) return 'office';
            if (workType.includes('明')) return 'off-day';
            if (workType.includes('法')) return 'holiday';
            if (workType.includes('有')) return 'paid-leave';
            return '';
        }
        
        // 行データから完全なデータを取得するヘルパー関数
        function getFullDataFromRow(row) {
            try {
                return JSON.parse(row.dataset.fullData);
            } catch (e) {
                console.warn('行データの解析に失敗:', e);
                return null;
            }
        }
        
        // 全ての行データを取得するヘルパー関数
        function getAllRowData() {
            const rows = document.querySelectorAll('#results-body tr');
            return Array.from(rows).map(row => getFullDataFromRow(row)).filter(data => data !== null);
        }
        
        // formatAttendanceTimes, getValidClockTimes は attendance-common.js から使用
        
        // 日時フォーマット（下位互換用）
        function formatDateTime(datetime) {
            if (!datetime) return '';
            const dt = new Date(datetime);
            return dt.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        // formatAlerts は attendance-common.js から使用
        
        // エラー表示
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        // フォームクリア
        function clearForm() {
            document.getElementById('search-form').reset();
            document.getElementById('results-section').style.display = 'none';
            document.getElementById('no-results').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
        }
        
        // 時間外申告データを月単位で取得
        async function fetchOvertimeDataForMonth(employeeId, results) {
            try {
                const response = await fetch(`/api/overtime?employee_num=${employeeId}&limit=1000`);
                const result = await response.json();
                
                if (result.status === 'success' && result.data) {
                    result.data.forEach(overtime => {
                        const cell = document.getElementById(`overtime-${overtime.work_date}`);
                        if (cell) {
                            const totalMin = (overtime.inner_overtime_minutes || 0) + (overtime.outer_overtime_minutes || 0);
                            const hours = (totalMin / 60).toFixed(1);
                            cell.innerHTML = `${overtime.start_time}-${overtime.end_time}<br><small>(${hours}h)</small>`;
                        }
                    });
                }
            } catch (error) {
                console.error('[時間外データ取得エラー]', error);
            }
        }
        
        // 休暇願データを月単位で取得
        async function fetchLeaveDataForMonth(employeeId, results) {
            try {
                const response = await fetch(`/api/leave?employee_num=${employeeId}&limit=1000`);
                const result = await response.json();
                
                if (result.status === 'success' && result.data) {
                    result.data.forEach(leave => {
                        // 休暇期間の各日付をチェック
                        const startDate = new Date(leave.leave_date_from);
                        const endDate = new Date(leave.leave_date_to);
                        
                        for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                            const dateStr = d.toISOString().split('T')[0];
                            const cell = document.getElementById(`leave-${dateStr}`);
                            if (cell) {
                                let detail = leave.leave_type;
                                if (leave.leave_subtype) {
                                    detail = leave.leave_subtype.substring(0, 20);
                                }
                                cell.innerHTML = `${detail}`;
                            }
                        }
                    });
                }
            } catch (error) {
                console.error('[休暇願データ取得エラー]', error);
            }
        }
        
        // generateCheckStatusHTML は attendance-common.js から使用
        
        // 確認ステータスを更新する関数
        async function updateCheckStatus(checkbox) {
            const employeeNum = checkbox.dataset.employee;
            const workDate = checkbox.dataset.date;
            const checkType = checkbox.dataset.type;
            const isChecked = checkbox.checked;
            
            const requestBody = {
                employee_num: employeeNum,
                work_date: workDate,
                check_type: checkType,
                is_checked: isChecked
            };
            
            try {
                const response = await fetch('/api/attendance-check-status', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });
                
                // ステータスコードをチェック
                if (!response.ok) {
                    // エラーレスポンスの詳細を取得して表示
                    let errorMessage = 'ステータス更新に失敗しました（HTTP ' + response.status + '）';
                    try {
                        const errorData = await response.json();
                        if (errorData.message) {
                            errorMessage = errorData.message;
                        }
                    } catch (e) {
                        // レスポンス解析失敗は無視
                    }
                    showError(errorMessage);
                    checkbox.checked = !isChecked;
                    return;
                }
                
                // Content-TypeをチェックしてJSONかどうかを確認
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    // JSONでない場合は認証エラーの可能性がある
                    showError('認証エラーが発生しました。再度ログインしてください。');
                    checkbox.checked = !isChecked;
                    return;
                }
                
                const result = await response.json();
                
                if (result.success) {
                    let statusId;
                    if (checkType === 'missing_punch') {
                        statusId = `missing-status-${employeeNum}-${workDate}`;
                    } else if (checkType === 'punch_leak') {
                        statusId = `punchleak-status-${employeeNum}-${workDate}`;
                    } else {
                        statusId = `timediff-status-${employeeNum}-${workDate}`;
                    }
                    const statusElement = document.getElementById(statusId);
                    
                    if (statusElement) {
                        if (isChecked) {
                            if (checkType === 'missing_punch') {
                                statusElement.textContent = '打刻もれチェック済　時間外無';
                            } else if (checkType === 'punch_leak') {
                                statusElement.textContent = '打刻漏れチェック済　時間外無';
                            } else {
                                statusElement.textContent = '時間外チェック済　時間外無';
                            }
                            statusElement.classList.add('completed');
                        } else {
                            statusElement.textContent = '未確認';
                            statusElement.classList.remove('completed');
                        }
                    }
                } else {
                    console.error('[updateCheckStatus] データベースへの保存失敗:', result);
                    showError('ステータス更新に失敗しました: ' + (result.message || '不明なエラー'));
                    checkbox.checked = !isChecked;
                }
            } catch (error) {
                // JSONパースエラーの場合
                if (error instanceof SyntaxError) {
                    showError('認証エラーが発生しました。再度ログインしてください。');
                } else {
                    console.error('ステータス更新エラー:', error);
                    showError('ステータス更新中にエラーが発生しました');
                }
                checkbox.checked = !isChecked;
            }
        }
        
        // 確認ステータスを読み込む関数
        async function loadCheckStatuses(results) {
            console.log('[ブラウザ] ===== loadCheckStatuses開始 =====');
            console.log('[ブラウザ] 結果件数:', results.length);
            if (!results || results.length === 0) {
                console.warn('[ブラウザ] 結果が空です');
                return;
            }
            
            for (const item of results) {
                if (!item || !item.employee_id || !item.work_date) {
                    console.warn('[ブラウザ] 無効なアイテム:', item);
                    continue;
                }
                
                console.log(`[ブラウザ] アイテム処理開始: employee_id=${item.employee_id}, work_date=${item.work_date}`);
                
                for (const checkType of ['missing_punch', 'time_difference', 'punch_leak']) {
                    try {
                        const employeeNum = item.employee_num || item.employee_id;
                        const url = `/api/attendance-check-status?employee_num=${employeeNum}&work_date=${item.work_date}&check_type=${checkType}`;
                        
                        const response = await fetch(url);
                        
                        if (!response.ok) {
                            continue;
                        }
                        
                        const contentType = response.headers.get('content-type');
                        if (!contentType || !contentType.includes('application/json')) {
                            continue;
                        }
                        
                        const result = await response.json();
                        
                        // チェック済みデータがある場合のみデバッグ出力
                        if (result.success && result.data && result.data.is_checked) {
                            console.log(`[ブラウザ] ✓ チェック済みデータ発見: employee=${item.employee_id}, date=${item.work_date}, check_type=${checkType}, is_checked=${result.data.is_checked}`);
                            let checkboxId, statusId;
                            if (checkType === 'missing_punch') {
                                checkboxId = `missing-${item.employee_id}-${item.work_date}`;
                                statusId = `missing-status-${item.employee_id}-${item.work_date}`;
                            } else if (checkType === 'punch_leak') {
                                checkboxId = `punchleak-${item.employee_id}-${item.work_date}`;
                                statusId = `punchleak-status-${item.employee_id}-${item.work_date}`;
                            } else {
                                checkboxId = `timediff-${item.employee_id}-${item.work_date}`;
                                statusId = `timediff-status-${item.employee_id}-${item.work_date}`;
                            }
                            
                            console.log(`[ブラウザ] DOM要素検索開始: checkboxId=${checkboxId}, statusId=${statusId}`);
                            const checkbox = document.getElementById(checkboxId);
                            const statusElement = document.getElementById(statusId);
                            console.log(`[ブラウザ] DOM要素検索結果: checkbox=${checkbox ? '存在' : 'なし'}, statusElement=${statusElement ? '存在' : 'なし'}`);
                            
                            if (checkbox && statusElement) {
                                console.log(`[ブラウザ] ✓ チェックボックスにチェックを設定: checkboxId=${checkboxId}, 現在のchecked=${checkbox.checked}`);
                                checkbox.checked = true;
                                console.log(`[ブラウザ] チェック後: checked=${checkbox.checked}`);
                                
                                if (checkType === 'missing_punch') {
                                    statusElement.textContent = '打刻もれチェック済　時間外無';
                                } else if (checkType === 'punch_leak') {
                                    statusElement.textContent = '打刻漏れチェック済　時間外無';
                                } else {
                                    statusElement.textContent = '時間外チェック済　時間外無';
                                }
                                statusElement.classList.add('completed');
                                console.log(`[ブラウザ] ✓ ステータス表示更新完了: statusId=${statusId}, textContent=${statusElement.textContent}`);
                            } else {
                                console.warn(`[ブラウザ] ✗ 要素が見つかりません: checkboxId=${checkboxId}, statusId=${statusId}, employee_id=${item.employee_id}, date=${item.work_date}`);
                            }
                        } else {
                            console.log(`[ブラウザ] チェック済みデータなし: success=${result.success}, data=`, result.data, `is_checked=`, result.data ? result.data.is_checked : 'N/A');
                        }
                    } catch (error) {
                        // すべてのエラーを無視して続行
                        // 認証エラーなどでHTMLが返される場合があるため、エラーをログに出力しない
                        continue;
                    }
                }
            }
        }
        
        // CSV出力
        function exportCSV() {
            if (searchResults.length === 0) {
                alert('出力するデータがありません');
                return;
            }
            
            let csv = '従業員ID,従業員名,勤務日,勤務タイプ,開始時刻,終了時刻,実際の打刻時間,エラー・警告\n';
            searchResults.forEach(item => {
                const attendanceTimes = (item.attendance_records || []).map(record => record.time_only).join(' ');
                
                // 退勤時刻の処理（24勤は翌日明に表示、明は前日24勤の退勤時刻を表示）
                let endTimeForCSV = '';
                if (item.work_type === '明' && item.night_shift_end_time) {
                    // 明の行で、前日24勤の退勤時刻がある場合
                    endTimeForCSV = `${item.night_shift_end_time} (${item.night_shift_work_type}退勤)`;
                } else if (item.work_type && item.work_type.includes('24勤')) {
                    // 24勤の場合は退勤時刻を表示しない
                    endTimeForCSV = '翌日明に表示';
                } else {
                    // 通常勤務
                    endTimeForCSV = item.end_time || '';
                }
                
                // アラート情報をCSVに追加
                const alertsText = (item.alerts || []).map(alert => {
                    return alert.details ? `${alert.message}: ${alert.details}` : alert.message;
                }).join('; ').replace(/"/g, '""');
                
                csv += `"${item.employee_id}","${item.employee_name || ''}","${item.work_date}","${item.work_type || ''}","${item.start_time || ''}","${endTimeForCSV}","${attendanceTimes}","${alertsText}"\n`;
            });
            
            // BOM（Byte Order Mark）を追加してExcelで文字化けを防ぐ
            const BOM = '\uFEFF';
            const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `schedule_${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
        }
    </script>
