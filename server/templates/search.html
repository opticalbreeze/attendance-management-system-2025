<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠スケジュール検索</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/minimal-ui.css') }}">
    <style>
        .search-form {
            background: var(--bg-secondary);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            border: var(--border-width) solid var(--border-color);
        }
        
        .results-section {
            margin-top: var(--spacing-lg);
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }
        
        .results-count {
            color: var(--text-secondary);
        }
        
        .btn-search {
            background: var(--accent-color);
            color: var(--bg-primary);
            border-color: var(--accent-color);
        }
        
        .btn-search:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        
        .btn-clear {
            background: var(--bg-primary);
            color: var(--text-primary);
            border-color: var(--border-color);
        }
        
        .btn-export {
            background: var(--accent-color);
            color: var(--bg-primary);
            border-color: var(--accent-color);
        }
        
        .btn-export:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        
        .results-table {
            border: var(--border-width) solid var(--border-color);
        }
        
        .results-table thead {
            background: var(--bg-secondary);
        }
        
        .results-table th {
            padding: var(--spacing-sm) var(--spacing-md);
            font-weight: 400;
        }
        
        /* 列幅の最適化 */
        .results-table th:nth-child(1) { width: 80px; }  /* 従業員ID */
        .results-table th:nth-child(2) { width: 100px; } /* 従業員名 */
        .results-table th:nth-child(3) { width: 90px; }  /* 勤務日 */
        .results-table th:nth-child(4) { width: 90px; }  /* 勤務タイプ */
        .results-table th:nth-child(5) { width: 70px; }  /* 開始時刻 */
        .results-table th:nth-child(6) { width: 70px; }  /* 終了時刻 */
        .results-table th:nth-child(7) { width: 120px; } /* 打刻時間 */
        .results-table th:nth-child(8) { width: 150px; } /* エラー */
        .results-table th:nth-child(9) { width: 80px; } /* 時間外 */
        .results-table th:nth-child(10) { width: 80px; } /* 休暇 */
        
        .idm-cell {
            font-family: 'Courier New', monospace;
            font-weight: 400;
        }
        
        .work-type {
            display: inline-block;
            padding: var(--spacing-xs) var(--spacing-sm);
            font-size: var(--font-size-sm);
            font-weight: 400;
            border: var(--border-width) solid var(--border-color);
            background: var(--bg-primary);
        }
        
        .attendance-times {
            font-family: 'Courier New', monospace;
            font-size: var(--font-size-sm);
        }
        
        .attendance-time {
            display: inline-block;
            padding: var(--spacing-xs) var(--spacing-sm);
            margin: 1px;
            font-weight: 400;
            border: var(--border-width) solid var(--border-color);
            background: var(--bg-secondary);
        }
        
        .attendance-time.valid-clock-in {
            background: var(--bg-primary);
            border-color: var(--accent-color);
        }
        
        .attendance-time.valid-clock-out {
            background: var(--bg-primary);
            border-color: var(--accent-color);
        }
        
        .no-attendance {
            color: var(--text-secondary);
            font-style: normal;
        }
        
        .alert-item {
            display: block;
            padding: var(--spacing-xs) var(--spacing-sm);
            margin: var(--spacing-xs) 0;
            font-size: var(--font-size-sm);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
            border: var(--border-width) solid var(--border-color);
            background: var(--bg-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="margin-bottom: var(--spacing-md);">
            <a href="/" class="back-link">トップページに戻る</a>
            <a href="/check" class="back-link" style="margin-left: var(--spacing-md);">勤怠チェック</a>
            <a href="/admin" class="back-link" style="margin-left: var(--spacing-md); color: #dc3545; border-color: #dc3545; font-weight: bold;">管理者ページ</a>
        </div>
        
        <h1>勤怠スケジュール検索</h1>
        
        <div class="search-form">
            <form id="search-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="section-select">セクション</label>
                        <select id="section-select">
                            <option value="">すべてのセクション</option>
                        </select>
                        <small style="color: #666; font-size: 0.8em; margin-top: 3px;">
                            セクションで絞り込み
                        </small>
                    </div>
                    <div class="form-group">
                        <label for="employee-id">従業員ID（必須）</label>
                        <select id="employee-id" name="employee_id" required>
                            <option value="">▼ 従業員を読み込み中...</option>
                        </select>
                        <small id="employee-hint" style="color: #666; font-size: 0.8em; margin-top: 3px; display: none;">
                            選択した従業員の詳細情報が表示されます
                        </small>
                    </div>
                    <div class="form-group">
                        <label for="search-month">検索月（必須）</label>
                        <input type="text" id="search-month" name="search_month" placeholder="例: 2025/12" value="" pattern="[0-9]{4}/[0-9]{1,2}" required>
                        <small style="color: #666; font-size: 0.8em; margin-top: 3px;">
                            yyyy/mm形式で入力（前月16日〜当月15日を検索）
                        </small>
                    </div>
                </div>
                <div>
                    <button type="submit" class="btn btn-search">🔍 検索</button>
                    <button type="button" class="btn btn-clear" onclick="clearForm()">🔄 クリア</button>
                </div>
            </form>
        </div>
        
        <div id="error-message" style="display: none;" class="error"></div>
        
        <div class="results-section" id="results-section" style="display: none;">
            <div class="results-header">
                <div class="results-count" id="results-count">検索結果: 0 件</div>
                <button class="btn-export" onclick="exportCSV()">📥 CSV出力</button>
            </div>
            
            <div style="overflow-x: auto;">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>従業員ID</th>
                            <th>従業員名</th>
                            <th>勤務日 📅↑</th>
                            <th>勤務タイプ</th>
                            <th>開始時刻</th>
                            <th>終了時刻</th>
                            <th>実際の打刻時間 🕐</th>
                            <th>エラー・警告</th>
                            <th>時間外申告</th>
                            <th>休暇願</th>
                        </tr>
                    </thead>
                    <tbody id="results-body">
                    </tbody>
                </table>
            </div>
        </div>
        
        <div id="loading" class="loading" style="display: none;">
            検索中...
        </div>
        
        <div id="no-results" class="no-results" style="display: none;">
            検索条件に一致するデータが見つかりませんでした。
        </div>


    </div>
    
    <!-- 共通ライブラリを読み込み -->
    <script src="{{ url_for('static', filename='js/attendance-common.js') }}"></script>
    
    <script>
        let searchResults = [];
        
        // ページ読み込み時の初期化処理
        // 全従業員データを保持
        let allEmployees = [];
        
        document.addEventListener('DOMContentLoaded', async function() {
            // 従業員情報を動的に読み込み
            await loadEmployees();
            
        // 現在の日付から適切な月度を計算して設定
        function calculateCurrentPayrollMonth() {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1; // 0ベースなので+1
            const day = today.getDate();
            
            // 16日以降なら翌月度、15日以前なら当月度
            if (day >= 16) {
                // 翌月度
                if (month === 12) {
                    return `${year + 1}/1`;
                } else {
                    return `${year}/${month + 1}`;
                }
            } else {
                // 当月度
                return `${year}/${month}`;
            }
        }
        
        document.getElementById('search-month').value = calculateCurrentPayrollMonth();            // セクション変更時に従業員リストを更新
            const sectionSelect = document.getElementById('section-select');
            if (sectionSelect) {
                sectionSelect.addEventListener('change', updateEmployeeList);
            }
        });
        
        // 従業員情報を動的に読み込む
        async function loadEmployees() {
            const employeeSelect = document.getElementById('employee-id');
            const sectionSelect = document.getElementById('section-select');
            const employeeHint = document.getElementById('employee-hint');
            
            try {
                const response = await fetch('/api/employees');
                const result = await response.json();
                
                if (result.status === 'success' && result.data) {
                    // 全従業員データを保存
                    allEmployees = result.data;
                    
                    // セクション一覧を取得・設定
                    const sections = [...new Set(result.data.map(emp => emp.section || '設備'))].sort();
                    sectionSelect.innerHTML = '<option value="">すべてのセクション</option>';
                    sections.forEach(section => {
                        const option = document.createElement('option');
                        option.value = section;
                        option.textContent = section;
                        sectionSelect.appendChild(option);
                    });
                    
                    // 従業員リストを更新
                    updateEmployeeList();
                    
                    // ヒント表示を有効化
                    employeeHint.style.display = 'block';
                    employeeHint.textContent = `${result.data.length}名の従業員が読み込まれました`;
                } else {
                    throw new Error(result.message || '従業員データの読み込みに失敗');
                }
            } catch (error) {
                employeeSelect.innerHTML = '<option value="">❌ 従業員データ読み込み失敗</option>';
                employeeHint.style.display = 'block';
                employeeHint.textContent = '従業員データの読み込みに失敗しました';
                employeeHint.style.color = '#e74c3c';
            }
        }
        
        // セクションで絞り込んだ従業員リストを更新
        function updateEmployeeList() {
            const employeeSelect = document.getElementById('employee-id');
            const sectionSelect = document.getElementById('section-select');
            const selectedSection = sectionSelect.value;
            
            // 既存のオプションをクリア
            employeeSelect.innerHTML = '<option value="">▼ 従業員を選択してください</option>';
            
            // セクションでフィルタリング
            const filteredEmployees = selectedSection 
                ? allEmployees.filter(emp => (emp.section || '設備') === selectedSection)
                : allEmployees;
            
            // 従業員データでオプションを構築
            filteredEmployees.forEach(employee => {
                const option = document.createElement('option');
                option.value = employee.employee_num;
                
                // 表示名を構築（24勤シフトがある場合は明示）
                let displayName = `${employee.employee_num} - ${employee.name}`;
                if (employee.has_24hour_shifts) {
                    displayName += ' (24勤あり)';
                }
                if (employee.total_schedules > 0) {
                    displayName += ` [${employee.total_schedules}件]`;
                }
                
                option.textContent = displayName;
                
                // デフォルト選択（3252023を優先）
                if (employee.employee_num === '3252023') {
                    option.selected = true;
                }
                
                employeeSelect.appendChild(option);
            });
        }
        
        // フォーム送信
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await performSearch();
        });
        
        // 検索実行
        async function performSearch() {
            const employeeId = document.getElementById('employee-id').value.trim();
            const searchMonth = document.getElementById('search-month').value.trim();
            
            // バリデーション
            if (!employeeId) {
                showError('従業員IDを入力してください');
                return;
            }
            
            if (!searchMonth) {
                showError('検索月を入力してください（yyyy/mm形式）');
                return;
            }
            
            // 検索月の形式チェック
            const monthPattern = /^[0-9]{4}\/[0-9]{1,2}$/;
            if (!monthPattern.test(searchMonth)) {
                showError('検索月はyyyy/mm形式で入力してください（例: 2025/10）');
                return;
            }
            
            // UIリセット
            document.getElementById('results-section').style.display = 'none';
            document.getElementById('no-results').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            // クエリパラメータ構築
            const params = new URLSearchParams();
            params.append('employee_id', employeeId);
            params.append('search_month', searchMonth);
            
            const searchUrl = `/api/search?${params}`;

            try {
                const response = await fetch(searchUrl);
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (data.status === 'success') {
                    searchResults = data.results;
                    // デバッグ用：アラート情報を確認
                    console.log('検索結果データ:', data.results);
                    const totalAlerts = data.results.reduce((sum, item) => {
                        const alertCount = item.alerts ? item.alerts.length : 0;
                        if (alertCount > 0) {
                            console.log(`日付 ${item.work_date}: ${alertCount}件のアラート`, item.alerts);
                        }
                        return sum + alertCount;
                    }, 0);
                    console.log(`検索結果: ${data.results.length}件中、合計${totalAlerts}件のアラートを検出`);
                    displayResults(data.results, data.search_params);
                } else {
                    showError(data.message || '検索エラーが発生しました');
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showError('サーバーとの通信エラーが発生しました');
            }
        }
        
        // 検索結果を表示
        function displayResults(results, searchParams) {


            if (results.length === 0) {
                document.getElementById('no-results').style.display = 'block';
                return;
            }

            // 日付順でソート（古い順）
            results.sort((a, b) => {
                const dateA = new Date(a.work_date);
                const dateB = new Date(b.work_date);
                return dateA - dateB;
            });

            // 24勤の退勤時刻を翌日の明に移動するための前処理
            results = processNightShiftEndTimes(results);            const tbody = document.getElementById('results-body');
            tbody.innerHTML = '';
            
            results.forEach(item => {
                const tr = document.createElement('tr');
                // 打刻時間を整形（有効な打刻に色を付けるため、全結果を渡す）
                const attendanceTimesHtml = formatAttendanceTimes(item.attendance_records || [], item.work_type, item.work_date, results);
                
                // IDとシート番号は非表示だが、データは保持される（item.id, item.sheet_number）
                // アラート情報を表示
                const alerts = item.alerts || [];
                const alertsHtml = formatAlerts(alerts);
                
                // デバッグ用（開発時のみ）
                if (alerts.length > 0) {
                    console.log(`アラート検出: ${item.work_date}`, alerts);
                }
                
                tr.innerHTML = `
                    <td class="idm-cell">${item.employee_id}</td>
                    <td><strong>${item.employee_name || ''}</strong></td>
                    <td>${formatDate(item.work_date)}</td>
                    <td><span class="work-type ${getWorkTypeClass(item.work_type)}">${item.work_type || ''}</span></td>
                    <td>${formatTime(item.start_time)}</td>
                    <td>${formatEndTime(item)}</td>
                    <td class="attendance-times">${attendanceTimesHtml}</td>
                    <td id="alerts-${item.work_date}" style="font-size: 0.85em;">${alertsHtml}</td>
                    <td id="overtime-${item.work_date}" style="font-size: 0.85em; color: #667eea;">-</td>
                    <td id="leave-${item.work_date}" style="font-size: 0.85em; color: #28a745;">-</td>
                `;
                // 全データを行要素に保存（後で使用可能）
                tr.dataset.fullData = JSON.stringify(item);
                tbody.appendChild(tr);
            });
            
            // 時間外・休暇願データを非同期で取得
            const employeeId = searchParams.employee_id;
            fetchOvertimeDataForMonth(employeeId, results);
            fetchLeaveDataForMonth(employeeId, results);
            
            // 検索範囲の情報を表示
            let rangeInfo = '';
            if (searchParams && searchParams.date_range) {
                rangeInfo = ` (${searchParams.date_range.start_date} 〜 ${searchParams.date_range.end_date})`;
            }
            
            document.getElementById('results-count').textContent = `検索結果: ${results.length} 件${rangeInfo}`;
            document.getElementById('results-section').style.display = 'block';
        }
        
        // formatDate, formatTime は attendance-common.js から使用

        // 24勤の退勤時刻を翌日の明に移動する処理
        function processNightShiftEndTimes(results) {
            const processedResults = [...results];
            
            for (let i = 0; i < processedResults.length; i++) {
                const currentItem = processedResults[i];
                
                // 24勤の場合
                if (currentItem.work_type && currentItem.work_type.includes('24勤')) {
                    // 翌日の明を探す
                    const currentDate = new Date(currentItem.work_date);
                    const nextDay = new Date(currentDate);
                    nextDay.setDate(currentDate.getDate() + 1);
                    const nextDateStr = nextDay.toISOString().split('T')[0];
                    
                    const nextDayOffItem = processedResults.find(item => 
                        item.work_date === nextDateStr && item.work_type === '明'
                    );
                    
                    if (nextDayOffItem && currentItem.end_time) {
                        // 24勤の退勤時刻を翌日の明に移動
                        nextDayOffItem.night_shift_end_time = currentItem.end_time;
                        nextDayOffItem.night_shift_work_type = currentItem.work_type;
                        
                        // 24勤の退勤時刻をクリア
                        currentItem.end_time = null;
                    }
                }
            }
            
            return processedResults;
        }

        // 退勤時刻表示（24勤の場合は翌日明に表示）
        function formatEndTime(item) {
            // 明の行で、前日24勤の退勤時刻がある場合
            if (item.work_type === '明' && item.night_shift_end_time) {
                const timeStr = formatTime(item.night_shift_end_time);
                return `${timeStr} <span style="color: #3498db; font-size: 0.8em;">(${item.night_shift_work_type}退勤)</span>`;
            }
            
            // 24勤の場合は退勤時刻を表示しない（翌日明に移動済み）
            if (item.work_type && item.work_type.includes('24勤')) {
                return '<span style="color: #999; font-style: italic;">翌日明に表示</span>';
            }
            
            // 通常勤務の場合はそのまま
            return formatTime(item.end_time);
        }
        
        // getWorkTypeClass は attendance-common.js から使用
        
        // 行データから完全なデータを取得するヘルパー関数
        function getFullDataFromRow(row) {
            try {
                return JSON.parse(row.dataset.fullData);
            } catch (e) {
                console.warn('行データの解析に失敗:', e);
                return null;
            }
        }
        
        // 全ての行データを取得するヘルパー関数
        function getAllRowData() {
            const rows = document.querySelectorAll('#results-body tr');
            return Array.from(rows).map(row => getFullDataFromRow(row)).filter(data => data !== null);
        }
        
        // formatAttendanceTimes, getValidClockTimes は attendance-common.js から使用
        
        // 日時フォーマット（下位互換用）
        function formatDateTime(datetime) {
            if (!datetime) return '';
            const dt = new Date(datetime);
            return dt.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        // formatAlerts は attendance-common.js から使用
        
        // エラー表示
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        // フォームクリア
        function clearForm() {
            document.getElementById('search-form').reset();
            document.getElementById('results-section').style.display = 'none';
            document.getElementById('no-results').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
        }
        
        // 時間外申告データを月単位で取得
        async function fetchOvertimeDataForMonth(employeeId, results) {
            try {
                const response = await fetch(`/api/overtime?employee_num=${employeeId}&limit=1000`);
                const result = await response.json();
                
                if (result.status === 'success' && result.data) {
                    result.data.forEach(overtime => {
                        const cell = document.getElementById(`overtime-${overtime.work_date}`);
                        if (cell) {
                            const totalMin = (overtime.inner_overtime_minutes || 0) + (overtime.outer_overtime_minutes || 0);
                            const hours = (totalMin / 60).toFixed(1);
                            cell.innerHTML = `${overtime.start_time}-${overtime.end_time}<br><small>(${hours}h)</small>`;
                        }
                    });
                }
            } catch (error) {
                console.error('[時間外データ取得エラー]', error);
            }
        }
        
        // 休暇願データを月単位で取得
        async function fetchLeaveDataForMonth(employeeId, results) {
            try {
                const response = await fetch(`/api/leave?employee_num=${employeeId}&limit=1000`);
                const result = await response.json();
                
                if (result.status === 'success' && result.data) {
                    result.data.forEach(leave => {
                        // 休暇期間の各日付をチェック
                        const startDate = new Date(leave.leave_date_from);
                        const endDate = new Date(leave.leave_date_to);
                        
                        for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                            const dateStr = d.toISOString().split('T')[0];
                            const cell = document.getElementById(`leave-${dateStr}`);
                            if (cell) {
                                let detail = leave.leave_type;
                                if (leave.leave_subtype) {
                                    detail = leave.leave_subtype.substring(0, 20);
                                }
                                cell.innerHTML = `${detail}`;
                            }
                        }
                    });
                }
            } catch (error) {
                console.error('[休暇願データ取得エラー]', error);
            }
        }
        
        // CSV出力
        function exportCSV() {
            if (searchResults.length === 0) {
                alert('出力するデータがありません');
                return;
            }
            
            let csv = '従業員ID,従業員名,勤務日,勤務タイプ,開始時刻,終了時刻,実際の打刻時間,エラー・警告\n';
            searchResults.forEach(item => {
                const attendanceTimes = (item.attendance_records || []).map(record => record.time_only).join(' ');
                
                // 退勤時刻の処理（24勤は翌日明に表示、明は前日24勤の退勤時刻を表示）
                let endTimeForCSV = '';
                if (item.work_type === '明' && item.night_shift_end_time) {
                    // 明の行で、前日24勤の退勤時刻がある場合
                    endTimeForCSV = `${item.night_shift_end_time} (${item.night_shift_work_type}退勤)`;
                } else if (item.work_type && item.work_type.includes('24勤')) {
                    // 24勤の場合は退勤時刻を表示しない
                    endTimeForCSV = '翌日明に表示';
                } else {
                    // 通常勤務
                    endTimeForCSV = item.end_time || '';
                }
                
                // アラート情報をCSVに追加
                const alertsText = (item.alerts || []).map(alert => {
                    return alert.details ? `${alert.message}: ${alert.details}` : alert.message;
                }).join('; ').replace(/"/g, '""');
                
                csv += `"${item.employee_id}","${item.employee_name || ''}","${item.work_date}","${item.work_type || ''}","${item.start_time || ''}","${endTimeForCSV}","${attendanceTimes}","${alertsText}"\n`;
            });
            
            // BOM（Byte Order Mark）を追加してExcelで文字化けを防ぐ
            const BOM = '\uFEFF';
            const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `schedule_${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
        }
    </script>
</body>
</html>
