<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ページ - 勤怠管理システム</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .admin-section {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            padding: 25px;
        }
        
        .admin-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }
        
        .upload-area {
            border: 2px dashed #3498db;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background: #f8f9fa;
            transition: background-color 0.3s;
        }
        
        .upload-area:hover {
            background: #e3f2fd;
        }
        
        .upload-area.dragover {
            background: #bbdefb;
            border-color: #1976d2;
        }
        
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }
        
        .file-input {
            position: absolute;
            left: -9999px;
        }
        
        .file-input-button {
            background: #3498db;
            color: white;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            transition: background-color 0.3s;
            border: none;
            font-size: 16px;
        }
        
        .file-input-button:hover {
            background: #2980b9;
        }
        
        .selected-file {
            margin: 15px 0;
            padding: 10px;
            background: #e8f5e8;
            border-radius: 5px;
            color: #2e7d32;
        }
        
        .import-button {
            background: #27ae60;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .import-button:hover:not(:disabled) {
            background: #2ecc71;
        }
        
        .import-button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        
        .progress {
            display: none;
            margin: 20px 0;
            padding: 15px;
            background: #f1c40f;
            color: #fff;
            border-radius: 5px;
            text-align: center;
        }
        
        .result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stats-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stats-number {
            font-size: 2em;
            font-weight: bold;
            color: #3498db;
        }
        
        .stats-label {
            color: #7f8c8d;
            margin-top: 5px;
        }
        
        .work-type-list {
            max-height: 200px;
            overflow-y: auto;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }
        
        .work-type-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #e9ecef;
        }
        
        .work-type-item:last-child {
            border-bottom: none;
        }
        
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        
        .navigation-links {
            margin-bottom: 30px;
        }
        
        .navigation-links a {
            display: inline-block;
            margin-right: 15px;
            padding: 10px 20px;
            background: #34495e;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        .navigation-links a:hover {
            background: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- ナビゲーション -->
        <div class="navigation-links">
            <a href="/">トップページ</a>
            <a href="/search">検索</a>
            <a href="/check">勤怠チェック</a>
            <a href="/monthly-report">月間レポート</a>
            <a href="/logout">ログアウト</a>
        </div>
        
        <h1>管理者ページ</h1>
        
        <!-- CSVインポート機能 -->
        <div class="admin-section">
            <h2>📁 CSVファイル インポート</h2>
            <p>勤怠スケジュールデータをCSVファイルからインポートできます。</p>
            
            <div class="upload-area" id="uploadArea">
                <div>
                    <p>📊 CSVファイルをここにドラッグ＆ドロップ</p>
                    <p>または</p>
                    
                    <div class="file-input-wrapper">
                        <input type="file" id="csvFile" class="file-input" accept=".csv">
                        <label for="csvFile" class="file-input-button">ファイルを選択</label>
                    </div>
                </div>
                
                <div class="selected-file" id="selectedFile" style="display: none;">
                    <span id="fileName"></span>
                    <button onclick="clearSelectedFile()" style="float: right; background: none; border: none; color: #e74c3c; cursor: pointer;">✕</button>
                </div>
                
                <button class="import-button" id="importButton" onclick="importCSV()" disabled>インポート実行</button>
            </div>
            
            <div class="progress" id="progress">
                <p>📤 インポート処理中...</p>
            </div>
            
            <div class="result" id="result">
                <div id="resultMessage"></div>
                <div id="resultDetails"></div>
            </div>
        </div>
        
        <!-- データベース統計情報 -->
        <div class="admin-section">
            <h2>📊 データベース統計情報</h2>
            <button onclick="loadDatabaseStats()" class="import-button">統計情報を更新</button>
            
            <div class="stats-grid" id="statsGrid">
                <!-- 統計情報がここに表示される -->
            </div>
            
            <div class="work-type-list" id="workTypeList" style="display: none;">
                <h3>勤務区分別データ</h3>
                <!-- 勤務区分別統計がここに表示される -->
            </div>
        </div>
        
        <!-- 今後の機能拡張エリア -->
        <div class="admin-section">
            <h2>🚧 今後の機能</h2>
            <ul>
                <li>データベースバックアップ・復元</li>
                <li>ユーザー管理機能</li>
                <li>システム設定管理</li>
                <li>ログ管理・監査機能</li>
                <li>自動メール通知設定</li>
            </ul>
        </div>
    </div>

    <script>
        let selectedFile = null;
        
        // ファイル選択イベント
        document.getElementById('csvFile').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                selectFile(e.target.files[0]);
            }
        });
        
        // ドラッグ＆ドロップ機能
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].name.toLowerCase().endsWith('.csv')) {
                selectFile(files[0]);
            } else {
                showResult('error', 'CSVファイルを選択してください');
            }
        });
        
        function selectFile(file) {
            selectedFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('selectedFile').style.display = 'block';
            document.getElementById('importButton').disabled = false;
            hideResult();
        }
        
        function clearSelectedFile() {
            selectedFile = null;
            document.getElementById('selectedFile').style.display = 'none';
            document.getElementById('importButton').disabled = true;
            document.getElementById('csvFile').value = '';
            hideResult();
        }
        
        function importCSV() {
            if (!selectedFile) return;
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            showProgress();
            hideResult();
            
            fetch('/api/admin/csv/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                hideProgress();
                
                if (data.success) {
                    showResult('success', data.message, data.details);
                    clearSelectedFile();
                    // 統計情報を自動更新
                    loadDatabaseStats();
                } else {
                    showResult('error', data.message, data.details);
                }
            })
            .catch(error => {
                hideProgress();
                showResult('error', 'ネットワークエラー: ' + error.message);
            });
        }
        
        function showProgress() {
            document.getElementById('progress').style.display = 'block';
            document.querySelector('.admin-container').classList.add('loading');
        }
        
        function hideProgress() {
            document.getElementById('progress').style.display = 'none';
            document.querySelector('.admin-container').classList.remove('loading');
        }
        
        function showResult(type, message, details = null) {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('resultMessage');
            const detailsDiv = document.getElementById('resultDetails');
            
            resultDiv.className = 'result ' + type;
            messageDiv.textContent = message;
            
            if (details) {
                let detailsHtml = '';
                if (details.processed !== undefined) {
                    detailsHtml += `<p>処理済み: ${details.processed}件</p>`;
                }
                if (details.errors !== undefined) {
                    detailsHtml += `<p>エラー: ${details.errors}件</p>`;
                }
                if (details.increase !== undefined) {
                    detailsHtml += `<p>追加レコード: ${details.increase}件</p>`;
                }
                if (details.error_messages && details.error_messages.length > 0) {
                    detailsHtml += '<p>エラーメッセージ:</p><ul>';
                    details.error_messages.forEach(msg => {
                        detailsHtml += `<li>${msg}</li>`;
                    });
                    detailsHtml += '</ul>';
                }
                detailsDiv.innerHTML = detailsHtml;
            } else {
                detailsDiv.innerHTML = '';
            }
            
            resultDiv.style.display = 'block';
        }
        
        function hideResult() {
            document.getElementById('result').style.display = 'none';
        }
        
        function loadDatabaseStats() {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = '<p>読み込み中...</p>';
            
            fetch('/api/admin/database/stats')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    displayStats(data.data);
                } else {
                    statsGrid.innerHTML = '<p>統計情報の取得に失敗しました</p>';
                }
            })
            .catch(error => {
                statsGrid.innerHTML = '<p>ネットワークエラー</p>';
            });
        }
        
        function displayStats(stats) {
            const statsGrid = document.getElementById('statsGrid');
            const workTypeList = document.getElementById('workTypeList');
            
            // 基本統計
            statsGrid.innerHTML = `
                <div class="stats-card">
                    <div class="stats-number">${stats.basic.employees}</div>
                    <div class="stats-label">従業員数</div>
                </div>
                <div class="stats-card">
                    <div class="stats-number">${stats.basic.total_records}</div>
                    <div class="stats-label">総レコード数</div>
                </div>
                <div class="stats-card">
                    <div class="stats-number">${stats.basic.start_date || '-'}</div>
                    <div class="stats-label">開始日</div>
                </div>
                <div class="stats-card">
                    <div class="stats-number">${stats.basic.end_date || '-'}</div>
                    <div class="stats-label">最終日</div>
                </div>
            `;
            
            // 勤務区分別統計
            if (stats.work_types && stats.work_types.length > 0) {
                let workTypeHtml = '<h3>勤務区分別データ</h3>';
                stats.work_types.forEach(item => {
                    workTypeHtml += `
                        <div class="work-type-item">
                            <span>${item.type}</span>
                            <strong>${item.count}件</strong>
                        </div>
                    `;
                });
                workTypeList.innerHTML = workTypeHtml;
                workTypeList.style.display = 'block';
            }
        }
        
        // ページ読み込み時に統計情報を取得
        document.addEventListener('DOMContentLoaded', function() {
            loadDatabaseStats();
        });
    </script>
</body>
</html>
